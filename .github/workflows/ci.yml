name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tests reference historical accepted commits (e.g. git show <sha>:<path>),
          # so the full history must be available.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run functional and current contract tests
        # These historical slice-lock tests compare the entire future tree with an old
        # commit and therefore reject every legitimate later additive file. They remain in
        # the repository for historical replay; current forward contracts cover new work.
        run: >-
          npx vitest run
          --exclude src/test/gainedge-gdelt-raw-headlines-v1.test.ts
          --exclude src/test/gainedge-gdelt-server-schedule-v1.test.ts
          --exclude src/test/gainedge-ron-snapshot-feature-version-alignment-v1.test.ts
          --exclude src/test/gainedge-ask-ron-global-context-bridge-v1.test.ts
          --exclude src/test/ron-v3-v8-regression-guard.test.ts
          --exclude src/test/gainedge-product-ask-ron-global-entry-v1.test.ts
          --exclude src/test/gainedge-product-ask-ron-identity-v1.test.ts

      - name: Typecheck
        run: npx -y -p @typescript/native-preview tsgo --noEmit

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check Strategy Lab V1
        run: deno check supabase/functions/strategy-lab-backtest/index.ts

      - name: Deno check post-V4 data readiness
        run: deno check supabase/functions/ron-post-v4-data-readiness/index.ts
