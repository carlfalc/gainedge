name: RON Forward CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-forward-ron:
    if: github.head_ref == 'ron-runtime-completion-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run forward-compatible test suite
        run: >-
          npx vitest run
          --exclude src/test/gainedge-gdelt-raw-headlines-v1.test.ts
          --exclude src/test/gainedge-gdelt-server-schedule-v1.test.ts
          --exclude src/test/gainedge-ron-snapshot-feature-version-alignment-v1.test.ts
          --exclude src/test/gainedge-ask-ron-global-context-bridge-v1.test.ts
          --exclude src/test/ron-v3-v8-regression-guard.test.ts
          --exclude src/test/gainedge-product-ask-ron-global-entry-v1.test.ts

      - name: Typecheck
        run: npx -y -p @typescript/native-preview tsgo --noEmit

      - name: Build
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno check HK50 forward venue contract
        run: deno check supabase/functions/_shared/ron-venue-registry-v2.ts

      - name: Deno check instrument-aware Session V4
        run: deno check supabase/functions/_shared/ron-session-context-v4.ts

      - name: Deno check post-V4 data readiness
        run: deno check supabase/functions/ron-post-v4-data-readiness/index.ts

      - name: Deno check unattended candle ingestion
        run: deno check supabase/functions/ingest-candles/index.ts

      - name: Deno check multi-market snapshot worker
        run: deno check supabase/functions/ron-snapshot/index.ts

      - name: Deno check all-session RON scheduler
        run: deno check supabase/functions/ron-context-scheduler/index.ts

      - name: Deno check historical setup observation contract
        run: deno check supabase/functions/_shared/ron-historical-setup-observation-v1.ts

      - name: Deno check historical setup refresh worker
        run: deno check supabase/functions/ron-historical-setup-refresh/index.ts

      - name: Deno check opportunity context with specialist commentary
        run: deno check supabase/functions/ron-opportunity-context/index.ts
